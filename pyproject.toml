[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plantagochi-models"
version = "0.1.0"
description = "Leaf detection and area analysis using YOLOv8 segmentation"
requires-python = ">=3.9, <3.12"
dependencies = [
    "onnxruntime>=1.16.0",
    "Pillow>=9.0.0",
    "numpy>=1.24.0",
    "ai-edge-litert>=1.2.0"
]

[project.optional-dependencies]
full = [
    "tflite_runtime"
]

[tool.hatch.build.targets.wheel]
packages = ["planta_gochi"]

[tool.hatch.build]
include = [
    "planta_gochi/**",
]